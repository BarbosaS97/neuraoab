<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite — NeuraOAB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../images/favicon-180.png">
<meta name="theme-color" content="#0f1420">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.js" integrity="sha384-UxmVkfpcoSCBn4QrHwxxZVlCbloMpP/2Ay2ByWcNy6TcMxC3JUgqa8Geipyl0tP7" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --panel-border: #262f45;
    --text: #e6e9f0;
    --text-dim: #8b93a7;
    --accent: #4f7cff;
    --accent-hover: #6b91ff;
    --err: #ef5757;
    --ok: #35c78a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.6);
    text-align: center;
  }
  .logo { display: block; height: 46px; width: auto; margin: 0 auto 22px; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .sub { margin: 0 0 4px; font-size: 13px; color: var(--text-dim); line-height: 1.55; }
  .actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  button, .btn-link {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    display: block;
    box-sizing: border-box;
  }
  button:hover:not(:disabled), .btn-link:hover { background: var(--accent-hover); }
  button:disabled { background: #33394a; color: #767c8c; cursor: not-allowed; }
  .btn-secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text); }
  .btn-secondary:hover { background: #1c2438; }
  .msg { margin: 18px 0 0; padding: 10px 12px; border-radius: 7px; font-size: 13px; display: none; text-align: left; }
  .msg.show { display: block; }
  .msg.err { background: rgba(239, 87, 87, 0.1); border: 1px solid rgba(239, 87, 87, 0.35); color: var(--err); }
  .msg.ok { background: rgba(53, 199, 138, 0.1); border: 1px solid rgba(53, 199, 138, 0.35); color: var(--ok); }
  .spinner {
    width: 22px; height: 22px; margin: 8px auto 0;
    border: 2px solid var(--panel-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="screen">
  <div class="card">
    <img src="../images/logotipo.png" alt="NeuraOAB" class="logo">
    <h1 id="title">Convite</h1>
    <p class="sub" id="statusMsg">Confirmando seu convite...</p>
    <div class="spinner" id="spinner"></div>

    <div class="actions" id="loggedOutActions" hidden>
      <a class="btn-link" href="../index.html" id="loginLink">Entrar</a>
      <a class="btn-link btn-secondary" href="../index.html" id="signupLink">Criar conta</a>
    </div>

    <div class="actions" id="acceptActions" hidden>
      <button type="button" id="acceptBtn">Aceitar convite</button>
    </div>

    <div class="actions" id="doneActions" hidden>
      <a class="btn-link" href="index.html">Ir para meus estudos</a>
    </div>

    <p class="msg" id="formMsg"></p>
  </div>
</div>

<script>
  // Mesma anon key publica de sempre (ver estudos/estudos.js) — quem
  // protege este convite e' o codigo em si (validado server-side pela Edge
  // Function "aluno-portal", nunca so' pela presenca da anon key).
  const SUPABASE_URL = "https://lgcphxncteqpbntnlzhe.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnY3BoeG5jdGVxcGJudG5semhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzI5NTIsImV4cCI6MjEwMzM0ODk1Mn0.gQltbgj-OPpDEPuyOSonM3G8h1ppwwez0Dwi3SOdx98";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Mesma chave que index.html lê depois do login/cadastro (ver
  // ROLE_DESTINATIONS ali) pra saber que precisa voltar pra ESTE convite em
  // vez de ir direto pra estudos/index.html.
  const PENDING_CONVITE_KEY = "neuraoab-pending-convite";

  const titleEl = document.getElementById("title");
  const statusMsg = document.getElementById("statusMsg");
  const spinner = document.getElementById("spinner");
  const loggedOutActions = document.getElementById("loggedOutActions");
  const acceptActions = document.getElementById("acceptActions");
  const doneActions = document.getElementById("doneActions");
  const acceptBtn = document.getElementById("acceptBtn");
  const formMsg = document.getElementById("formMsg");

  function showFormMsg(text, kind) {
    formMsg.textContent = text;
    formMsg.className = `msg show ${kind}`;
  }

  const codigo = new URLSearchParams(window.location.search).get("c");

  function showInvalidLink() {
    spinner.hidden = true;
    statusMsg.textContent = "Link inválido — nenhum código de convite encontrado nesta URL.";
    doneActions.hidden = false;
  }

  function showLoggedOut() {
    spinner.hidden = true;
    statusMsg.textContent = "Entre ou crie sua conta pra aceitar o convite.";
    sessionStorage.setItem(PENDING_CONVITE_KEY, codigo);
    loggedOutActions.hidden = false;
  }

  async function callAlunoPortal(payload) {
    const { data, error } = await client.functions.invoke("aluno-portal", { body: payload });
    if (error) {
      let detail = error.message;
      try {
        const body = await error.context?.json?.();
        if (body?.error) detail = body.error;
      } catch {
        // mantém a mensagem genérica
      }
      throw new Error(detail);
    }
    if (data?.error) throw new Error(data.error);
    return data;
  }

  async function showConvite() {
    try {
      const result = await callAlunoPortal({ action: "validar-convite", codigo });
      spinner.hidden = true;
      titleEl.textContent = "Você foi convidado!";
      statusMsg.textContent = `${result.professor_nome} te convidou para a turma "${result.turma_nome}". Aceite pra entrar na turma e liberar o acesso Pro.`;
      acceptActions.hidden = false;
    } catch (err) {
      spinner.hidden = true;
      statusMsg.textContent = "Não foi possível confirmar este convite.";
      showFormMsg(err.message || "Ocorreu um erro inesperado.", "err");
      doneActions.hidden = false;
    }
  }

  acceptBtn.addEventListener("click", async () => {
    acceptBtn.disabled = true;
    acceptBtn.textContent = "Ativando...";
    try {
      const result = await callAlunoPortal({ action: "ativar-convite", codigo });
      acceptActions.hidden = true;
      titleEl.textContent = "Convite aceito!";
      statusMsg.textContent = `Você agora faz parte da turma "${result.turma_nome}" e tem acesso Pro.`;
      showFormMsg("Redirecionando para o NeuraOAB...", "ok");
      setTimeout(() => window.location.replace("index.html"), 1800);
    } catch (err) {
      acceptBtn.disabled = false;
      acceptBtn.textContent = "Aceitar convite";
      showFormMsg(err.message || "Não foi possível aceitar o convite.", "err");
    }
  });

  async function init() {
    if (!codigo) {
      showInvalidLink();
      return;
    }

    const { data: { session } } = await client.auth.getSession();
    if (session?.user) {
      sessionStorage.removeItem(PENDING_CONVITE_KEY);
      await showConvite();
    } else {
      showLoggedOut();
    }
  }

  init();
</script>
</body>
</html>
