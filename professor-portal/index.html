<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Professor — NeuraOAB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../images/favicon-180.png">
<meta name="theme-color" content="#0f1420">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.js" integrity="sha384-UxmVkfpcoSCBn4QrHwxxZVlCbloMpP/2Ay2ByWcNy6TcMxC3JUgqa8Geipyl0tP7" crossorigin="anonymous"></script>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <img src="../images/logotipo.png" alt="NeuraOAB" class="login-logo">
    <h1 class="login-title">Portal do Professor</h1>
    <p class="login-sub">Acesso restrito a professores cadastrados</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="loginSubmit">Entrar</button>
    </form>

    <p class="login-error" id="loginError"></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
