<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Professor — NeuraOAB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../images/favicon-180.png">
<meta name="theme-color" content="#0f1420">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.js" integrity="sha384-UxmVkfpcoSCBn4QrHwxxZVlCbloMpP/2Ay2ByWcNy6TcMxC3JUgqa8Geipyl0tP7" crossorigin="anonymous"></script>
</head>
<body>

<div class="login-screen">
  <div class="login-card" id="loginCard">
    <img src="../images/logotipo.png" alt="NeuraOAB" class="login-logo">
    <h1 class="login-title">Portal do Professor</h1>
    <p class="login-sub" id="loginSub">Acesso restrito a professores autorizados</p>

    <!-- Um formulário só, alternando entre "Entrar" e "Criar conta" (ver
         setMode em js/auth.js) — id="password2" só é mostrado no modo
         "Criar conta". Sem Turnstile aqui de propósito: professor é
         público pequeno/curado, autorizado por e-mail (ver
         professores_autorizados no Portal Mestre), diferente do cadastro
         aberto de aluno na landing. -->
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" autocomplete="email" required>
        <!-- Só aparece no modo "Criar conta" — confirma contra a allowlist
             do Portal Mestre (professores_autorizados) antes de liberar o
             campo de senha abaixo (ver checkEmailForSignup em js/auth.js). -->
        <p class="field-status" id="signupEmailStatus" hidden></p>
      </div>
      <div class="field" id="loginPasswordField">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" autocomplete="current-password" minlength="8" required>
      </div>
      <div class="field" id="loginPassword2Field" hidden>
        <label for="loginPassword2">Confirme a senha</label>
        <input type="password" id="loginPassword2" autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn-primary" id="loginSubmitBtn">Entrar</button>
    </form>

    <div class="login-links">
      <button type="button" class="login-link" id="loginToggleModeBtn">Primeiro acesso? Criar conta</button>
      <button type="button" class="login-link" id="forgotPasswordBtn">Esqueci minha senha</button>
    </div>

    <p class="login-error" id="loginError"></p>
  </div>

  <!-- Mostrada em vez do login-card quando o login deu certo mas o e-mail
       não está autorizado (ver resolveAccess em js/auth.js) — nunca as
       duas ao mesmo tempo. -->
  <div class="restricted-card" id="restrictedView" hidden>
    <img src="../images/logotipo.png" alt="NeuraOAB" class="login-logo">
    <h1 class="restricted-title">Acesso Restrito</h1>
    <p class="restricted-sub">
      Esse e-mail ainda não está autorizado a usar o Portal do Professor. Contrate um dos
      planos abaixo pra liberar o acesso pro seu cursinho.
    </p>

    <div class="plans-card" id="plansCard"></div>

    <p class="whatsapp-contact-line" id="whatsappContactLine"></p>

    <button type="button" class="btn-ghost" id="restrictedLogoutBtn" style="width: 100%; margin-top: 18px;">Sair</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/planos-restrito.js"></script>
</body>
</html>
