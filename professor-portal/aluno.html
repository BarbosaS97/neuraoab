<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aluno — Portal do Professor — NeuraOAB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../images/favicon-180.png">
<meta name="theme-color" content="#0f1420">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.js" integrity="sha384-UxmVkfpcoSCBn4QrHwxxZVlCbloMpP/2Ay2ByWcNy6TcMxC3JUgqa8Geipyl0tP7" crossorigin="anonymous"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../images/logotipo.png" alt="NeuraOAB">
      <span>Portal do Professor</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Turmas
      </a>
      <a href="analises.html">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        Análises
      </a>
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Alternar tema"></button>
      <button type="button" class="btn-ghost" id="logoutBtn" style="flex: 1;">Sair</button>
    </div>
  </aside>

  <div class="main">
    <div class="main-inner">
      <nav class="breadcrumb">
        <a href="dashboard.html">Turmas</a>
        <span class="breadcrumb-sep">/</span>
        <a href="dashboard.html" id="breadcrumbTurma">…</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current" id="breadcrumbAluno">…</span>
      </nav>

      <div class="panel" id="studentHeaderPanel">
        <div class="panel-header">
          <h2 id="studentName">Carregando...</h2>
        </div>
        <p class="field-hint" id="studentMeta"></p>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="num" id="statFase1">—</div>
          <div class="label">Acertos na 1ª fase</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statFase2">—</div>
          <div class="label">Cadernos da 2ª fase respondidos</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Estatísticas — 1ª fase</h2>
          <div class="period-switch" id="fase1PeriodSwitch">
            <button class="period-btn" data-period="today" type="button">Hoje</button>
            <button class="period-btn" data-period="7d" type="button">7 dias</button>
            <button class="period-btn" data-period="30d" type="button">30 dias</button>
            <button class="period-btn active" data-period="all" type="button">Sempre</button>
          </div>
        </div>
        <div id="fase1Detail">
          <p class="field-hint">Carregando...</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>2ª fase — peças e questões discursivas</h2>
        </div>
        <div id="fase2List">
          <p class="field-hint">Carregando...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/aluno-detail.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
