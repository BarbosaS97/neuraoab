<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSP (auditoria de segurança 2026-09-09, ver comentário completo em
     index.html) — mesma política em toda página "interna" do site que só
     carrega supabase-js do jsdelivr + o próprio Supabase do projeto. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://lgcphxncteqpbntnlzhe.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">
<title>Turmas — Portal do Professor — NeuraOAB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../images/favicon-180.png">
<meta name="theme-color" content="#0f1420">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.114.0/dist/umd/supabase.js" integrity="sha384-UxmVkfpcoSCBn4QrHwxxZVlCbloMpP/2Ay2ByWcNy6TcMxC3JUgqa8Geipyl0tP7" crossorigin="anonymous"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../images/logotipo.png" alt="NeuraOAB">
      <span>Portal do Professor</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Turmas
      </a>
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Alternar tema"></button>
      <button type="button" class="btn-ghost" id="logoutBtn" style="flex: 1;">Sair</button>
    </div>
  </aside>

  <div class="main">
    <div class="main-inner">
      <div class="page-header">
        <div>
          <h1>Turmas</h1>
          <p>Organize seus alunos por turma e acompanhe o progresso de cada grupo separadamente.</p>
        </div>
        <button type="button" class="btn-accent" id="newTurmaBtn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Nova turma
        </button>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card-icon-row">
            <span class="stat-card-icon blue" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </span>
            <div>
              <div class="num" id="statTotalAlunos">—</div>
              <div class="label">Alunos cadastrados</div>
            </div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon-row">
            <span class="stat-card-icon green" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
            </span>
            <div>
              <div class="num" id="statAlunosAtivos">—</div>
              <div class="label">Alunos ativos</div>
            </div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon-row">
            <span class="stat-card-icon purple" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"></path><path d="M6 12.5V17c0 1.1 2.7 3 6 3s6-1.9 6-3v-4.5"></path></svg>
            </span>
            <div>
              <div class="num" id="statTotalTurmas">—</div>
              <div class="label">Turma(s) criada(s)</div>
            </div>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-search">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="turmaSearchInput" placeholder="Buscar turma...">
        </div>
        <select class="toolbar-select" id="turmaFilterSelect">
          <option value="todas">Todas</option>
          <option value="convites">Com convites pendentes</option>
          <option value="critico">Desempenho crítico</option>
        </select>
      </div>

      <div id="turmasGrid" class="turmas-grid">
        <p class="field-hint">Carregando...</p>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="turmaModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="turmaModalTitle">
    <div class="modal-header">
      <h2 id="turmaModalTitle">Nova turma</h2>
      <button type="button" id="turmaModalClose" class="modal-close" aria-label="Fechar">&times;</button>
    </div>
    <form id="turmaForm">
      <div class="modal-body">
        <p class="modal-msg" id="turmaModalMsg"></p>
        <input type="hidden" id="tuId">
        <div class="field">
          <label for="tuNome">Nome da turma</label>
          <input type="text" id="tuNome" required placeholder="Ex.: Intensivo Dezembro 2026">
        </div>
        <div class="field">
          <label for="tuDescricao">Descrição (opcional)</label>
          <input type="text" id="tuDescricao" placeholder="Ex.: Preparação - 2ª Fase OAB">
        </div>
        <div class="field">
          <label for="tuLimite">Limite de alunos</label>
          <input type="number" id="tuLimite" min="1" step="1" placeholder="Sem limite">
          <p class="field-hint">Deixe em branco pra não limitar quantos alunos podem aceitar convite pra esta turma.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" id="turmaModalCancel">Cancelar</button>
        <button type="submit" class="btn-accent" id="turmaModalSave">Criar turma</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/metrics.js"></script>
<script src="js/turmas.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
