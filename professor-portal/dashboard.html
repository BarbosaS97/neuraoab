<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turmas — Portal do Professor — NeuraOAB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../images/favicon-180.png">
<meta name="theme-color" content="#0f1420">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="../images/logotipo.png" alt="NeuraOAB">
      <span>Portal do Professor</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Turmas
      </a>
      <a href="analises.html">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        Análises
      </a>
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn" aria-label="Alternar tema"></button>
      <button type="button" class="btn-ghost" id="logoutBtn" style="flex: 1;">Sair</button>
    </div>
  </aside>

  <div class="main">
    <div class="main-inner">
      <div class="page-header">
        <div>
          <h1>Turmas</h1>
          <p>Organize seus alunos por turma pra acompanhar o progresso de cada grupo separadamente.</p>
        </div>
        <button type="button" class="btn-accent" id="newTurmaBtn">Nova turma</button>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="num" id="statTotalAlunos">—</div>
          <div class="label">Alunos cadastrados</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statAlunosAtivos">—</div>
          <div class="label">Alunos ativos</div>
        </div>
        <div class="stat-card">
          <div class="num" id="statTotalTurmas">—</div>
          <div class="label">Turmas criadas</div>
        </div>
      </div>

      <div id="turmasGrid" class="turmas-grid">
        <p class="field-hint">Carregando...</p>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="turmaModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="turmaModalTitle">
    <div class="modal-header">
      <h2 id="turmaModalTitle">Nova turma</h2>
      <button type="button" id="turmaModalClose" class="modal-close" aria-label="Fechar">&times;</button>
    </div>
    <form id="turmaForm">
      <div class="modal-body">
        <p class="modal-msg" id="turmaModalMsg"></p>
        <input type="hidden" id="tuId">
        <div class="field">
          <label for="tuNome">Nome da turma</label>
          <input type="text" id="tuNome" required placeholder="Ex.: Intensivo Dezembro 2026">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" id="turmaModalCancel">Cancelar</button>
        <button type="submit" class="btn-accent" id="turmaModalSave">Criar turma</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/turmas.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
