<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuraOAB</title>
<style>
  :root {
    --bg: #0d1117;
    --text: #f0f6fc;
    --text-dim: #8b949e;
    --primary: #8b5cf6;
    --logo-orange: #e2500a;
    --logo-purple: #7a18fc;
    --logo-blue: #0a6bfd;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .landing {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  /* Brilho ambiente atras da logo, nas cores da marca — da' o "impacto"
     da landing sem precisar de mais nenhum elemento na tela. */
  .landing::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 38%, rgba(226, 80, 10, 0.16), transparent 32%),
      radial-gradient(circle at 42% 45%, rgba(122, 24, 252, 0.18), transparent 38%),
      radial-gradient(circle at 58% 45%, rgba(10, 107, 253, 0.16), transparent 38%);
    pointer-events: none;
  }

  .logo {
    position: relative;
    width: min(340px, 70vw);
    height: auto;
    display: block;
    filter: drop-shadow(0 0 26px rgba(226, 80, 10, 0.35)) drop-shadow(0 0 34px rgba(10, 107, 253, 0.3));
    animation: riseIn 0.6s ease both;
  }

  .tagline {
    position: relative;
    margin: 28px 0 0;
    font-size: clamp(15px, 2.4vw, 19px);
    color: var(--text-dim);
    max-width: 480px;
    line-height: 1.5;
    animation: riseIn 0.6s ease 0.1s both;
  }

  .tagline strong { color: var(--text); font-weight: 600; }

  .cta {
    position: relative;
    margin-top: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 56px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--logo-orange), var(--logo-purple), var(--logo-blue));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-decoration: none;
    box-shadow: 0 16px 40px -16px rgba(122, 24, 252, 0.65);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    animation: riseIn 0.6s ease 0.2s both;
  }

  .cta:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 20px 46px -14px rgba(122, 24, 252, 0.75);
  }

  .cta:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .tagline, .cta { animation: none; }
  }
</style>
</head>
<body>

<div class="landing">
  <img class="logo" src="images/logotipo.png" alt="NeuraOAB">
  <p class="tagline"><strong>+ 2.000 questões oficiais</strong> e Chat IA embutido</p>
  <a class="cta" href="estudos/index.html">INICIAR</a>
</div>

</body>
</html>
