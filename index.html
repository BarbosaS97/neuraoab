<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuraOAB</title>
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #f0f6fc;
    --text-dim: #8b949e;
    --primary: #8b5cf6;
    --error: #da3633;
    --logo-orange: #e2500a;
    --logo-purple: #7a18fc;
    --logo-blue: #0a6bfd;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    /* overflow-y: auto (nao "hidden") — em telas baixas (celular deitado),
       o conteudo agora e' alto o suficiente pra nao caber sempre em 100vh;
       sem rolagem, o botao LOGIN (o UNICO jeito de sair dessa tela)
       ficaria cortado e inacessivel. Sem barra visivel quando tudo cabe. */
    overflow-y: auto;
    overflow-x: hidden;
  }

  .landing {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  /* Brilho ambiente atras da logo, nas cores da marca — da' o "impacto"
     da landing sem precisar de mais nenhum elemento na tela. */
  .landing::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 38%, rgba(226, 80, 10, 0.16), transparent 32%),
      radial-gradient(circle at 42% 45%, rgba(122, 24, 252, 0.18), transparent 38%),
      radial-gradient(circle at 58% 45%, rgba(10, 107, 253, 0.16), transparent 38%);
    pointer-events: none;
  }

  .logo {
    position: relative;
    width: min(340px, 70vw);
    height: auto;
    display: block;
    filter: drop-shadow(0 0 26px rgba(226, 80, 10, 0.35)) drop-shadow(0 0 34px rgba(10, 107, 253, 0.3));
    animation: riseIn 0.6s ease both;
  }

  /* Duas linhas, uma por fase da OAB — cada uma com seu proprio numero
     (mesma "bolinha" gradiente ja usada pra 1a/2a Fase dentro do app, ver
     estudos/style.css .phase-num) pra dar peso visual sem precisar de caixas,
     bordas ou qualquer elemento a mais nessa tela, que e' de proposito bem
     enxuta. */
  .phases {
    position: relative;
    margin: 28px 0 0;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: riseIn 0.6s ease 0.1s both;
  }

  .phase-line {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
  }

  .phase-num {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--logo-orange), var(--logo-purple), var(--logo-blue));
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }

  .phase-line p {
    margin: 0;
    font-size: clamp(14px, 2.2vw, 17px);
    color: var(--text-dim);
    line-height: 1.5;
  }

  .phase-line strong { color: var(--text); font-weight: 600; }

  /* Selo de credibilidade: uma linha fina (nao uma borda inteira, pra
     continuar leve) separando a proposta de valor do "prova social" —
     curto de proposito, so' pra reforcar confianca antes do CTA. */
  .divider {
    position: relative;
    width: 100%;
    max-width: 340px;
    height: 1px;
    margin: 26px 0 16px;
    background: linear-gradient(90deg, transparent, var(--text-dim), transparent);
    opacity: 0.3;
    animation: riseIn 0.6s ease 0.15s both;
  }

  .source-note {
    position: relative;
    margin: 0;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    animation: riseIn 0.6s ease 0.18s both;
  }

  /* Botao unico da tela: pilula com gradiente da marca, sombra em duas
     camadas (brilho colorido + sombra de profundidade) e um filete de luz
     no topo (inset), pra parecer solido/premium em vez de uma cor chapada.
     A seta desliza no hover — reforca "pra frente"/"comecar" sem precisar
     de mais texto. */
  .cta {
    position: relative;
    margin-top: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 46px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--logo-orange), var(--logo-purple), var(--logo-blue));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    box-shadow:
      0 18px 40px -14px rgba(122, 24, 252, 0.6),
      0 6px 18px -6px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.28);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    animation: riseIn 0.6s ease 0.24s both;
  }

  .cta-arrow {
    transition: transform 0.18s ease;
  }

  .cta:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
    box-shadow:
      0 22px 48px -12px rgba(122, 24, 252, 0.7),
      0 8px 22px -6px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.32);
  }

  .cta:hover .cta-arrow {
    transform: translateX(4px);
  }

  .cta:active {
    transform: translateY(0) scale(0.98);
  }

  .cta:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .phases, .divider, .source-note, .cta { animation: none; }
  }

  /* ------------------------------------------------------- Login modal */

  .login-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-overlay[hidden] { display: none; }

  .login-modal {
    position: relative;
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px 24px;
    box-shadow: 0 30px 70px -24px rgba(0, 0, 0, 0.7);
  }

  .login-modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-modal-close:hover { color: var(--text); border-color: var(--primary); }

  .login-modal-title {
    margin: 0 0 3px;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
  }

  .login-modal-sub {
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
  }

  /* Duas opções lado a lado (não empilhadas) — mais compacto, e o ícone
     substitui o que antes só o texto explicava. */
  .role-choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .role-choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 10px 14px;
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }

  .role-choice-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 999px;
    background: var(--card);
    color: var(--text-dim);
    transition: color 0.15s ease, background 0.15s ease;
  }

  .role-choice:hover { border-color: var(--primary); transform: translateY(-2px); }
  .role-choice:hover .role-choice-icon { color: var(--primary); }
  .role-choice strong { font-size: 13.5px; font-weight: 600; }
  .role-choice span { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

  .login-back {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12.5px;
    cursor: pointer;
    padding: 0;
    margin-bottom: 14px;
    font-family: inherit;
  }

  .login-back:hover { color: var(--text); }

  .login-field { margin-bottom: 14px; }

  .login-field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 5px;
  }

  /* Campo com ícone à esquerda (e, na senha, o botão de mostrar/ocultar à
     direita) — visual mais moderno que um input liso. */
  .input-wrap { position: relative; display: flex; align-items: center; }

  .input-wrap .input-icon {
    position: absolute;
    left: 12px;
    color: var(--text-dim);
    pointer-events: none;
    display: flex;
  }

  .login-field input {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 13px 10px 36px;
    font-size: 13.5px;
    font-family: inherit;
  }

  .login-field input#loginPassword { padding-right: 38px; }

  .login-field input:focus { outline: none; border-color: var(--primary); }

  .input-wrap .input-toggle {
    position: absolute;
    right: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
  }

  .input-wrap .input-toggle:hover { color: var(--text); }

  .login-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--logo-orange), var(--logo-purple), var(--logo-blue));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 0;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
    transition: filter 0.15s ease;
  }

  .login-submit:hover:not(:disabled) { filter: brightness(1.1); }
  .login-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  .login-error {
    margin: 12px 0 0;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    background: rgba(218, 54, 51, 0.12);
    border: 1px solid rgba(218, 54, 51, 0.35);
    color: var(--error);
    display: none;
  }

  .login-error.show { display: block; }
</style>
</head>
<body>

<div class="landing">
  <img class="logo" src="images/logotipo.png" alt="NeuraOAB">
  <div class="phases">
    <div class="phase-line">
      <span class="phase-num">1</span>
      <p><strong>+ 2.000 questões oficiais</strong> e Chat IA embutido</p>
    </div>
    <div class="phase-line">
      <span class="phase-num">2</span>
      <p><strong>Simulado de prática com peça e questões discursivas</strong>, correção em
        segundos pelos critérios oficiais de cada exame</p>
    </div>
  </div>
  <div class="divider"></div>
  <p class="source-note">Baseado em dados 100% oficiais da FGV</p>
  <button class="cta" id="loginBtn" type="button">
    LOGIN
    <svg class="cta-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="12" x2="20" y2="12"></line>
      <polyline points="13 5 20 12 13 19"></polyline>
    </svg>
  </button>
</div>

<!-- Modal de login em duas etapas: escolha do perfil (aluno/professor) ->
     formulário de credenciais. O papel escolhido só define o TÍTULO
     mostrado; quem decide pra onde a pessoa é mandada depois de logar é o
     role de verdade em profiles/roles (ver getRoleName/ROLE_DESTINATIONS
     abaixo) — assim, se alguém clicar na aba errada por engano, ainda cai
     no lugar certo em vez de travar num erro. -->
<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-modal" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
    <button type="button" class="login-modal-close" id="loginModalClose" aria-label="Fechar">&times;</button>

    <div id="roleStep">
      <h2 class="login-modal-title" id="loginModalTitle">Entrar</h2>
      <p class="login-modal-sub">Você é...</p>
      <div class="role-choices">
        <button type="button" class="role-choice" data-role="aluno">
          <span class="role-choice-icon">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <strong>Aluno</strong>
          <span>Convidado por um professor</span>
        </button>
        <button type="button" class="role-choice" data-role="professor">
          <span class="role-choice-icon">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          </span>
          <strong>Professor</strong>
          <span>Conta no Portal do Professor</span>
        </button>
      </div>
    </div>

    <form id="credsForm" hidden novalidate>
      <button type="button" class="login-back" id="loginBackBtn">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Voltar
      </button>
      <h2 class="login-modal-title" id="credsTitle">Entrar</h2>
      <p class="login-modal-sub">Use o e-mail e senha da sua conta</p>
      <div class="login-field">
        <label for="loginEmail">E-mail</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M2 6l10 7 10-7"></path></svg>
          </span>
          <input type="email" id="loginEmail" autocomplete="username" required>
        </div>
      </div>
      <div class="login-field">
        <label for="loginPassword">Senha</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          </span>
          <input type="password" id="loginPassword" autocomplete="current-password" required>
          <button type="button" class="input-toggle" id="togglePasswordBtn" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="login-submit" id="loginSubmitBtn">Entrar</button>
      <p class="login-error" id="loginErrorMsg"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // Mesma anon key publica de sempre (ver estudos/estudos.js, portal-mestre/
  // js/config.js etc.) — quem decide pra onde a pessoa vai depois de logar
  // e' a checagem de role abaixo, nao essa chave.
  const SUPABASE_URL = "https://lgcphxncteqpbntnlzhe.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnY3BoeG5jdGVxcGJudG5semhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NzI5NTIsImV4cCI6MjEwMzM0ODk1Mn0.gQltbgj-OPpDEPuyOSonM3G8h1ppwwez0Dwi3SOdx98";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Pra onde cada role vai depois de logar. Sessão do Supabase Auth fica no
  // localStorage do domínio (mesma origem pra landing/estudos/portal-mestre/
  // professor-portal), então a sessão criada aqui já "aparece" logada assim
  // que a próxima página carrega — não precisa passar token por querystring.
  const ROLE_DESTINATIONS = {
    admin: "portal-mestre/dashboard.html",
    professor: "professor-portal/dashboard.html",
    aluno: "estudos/index.html",
  };

  const loginBtn = document.getElementById("loginBtn");
  const loginOverlay = document.getElementById("loginOverlay");
  const loginModalClose = document.getElementById("loginModalClose");
  const roleStep = document.getElementById("roleStep");
  const credsForm = document.getElementById("credsForm");
  const credsTitle = document.getElementById("credsTitle");
  const loginBackBtn = document.getElementById("loginBackBtn");
  const loginEmail = document.getElementById("loginEmail");
  const loginPassword = document.getElementById("loginPassword");
  const togglePasswordBtn = document.getElementById("togglePasswordBtn");
  const loginSubmitBtn = document.getElementById("loginSubmitBtn");
  const loginErrorMsg = document.getElementById("loginErrorMsg");

  const EYE_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
  const EYE_OFF_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

  togglePasswordBtn.addEventListener("click", () => {
    const showing = loginPassword.type === "text";
    loginPassword.type = showing ? "password" : "text";
    togglePasswordBtn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
    togglePasswordBtn.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
  });

  function showRoleStep() {
    roleStep.hidden = false;
    credsForm.hidden = true;
    loginErrorMsg.className = "login-error";
  }

  function openLogin() {
    showRoleStep();
    credsForm.reset();
    togglePasswordBtn.innerHTML = EYE_ICON;
    loginPassword.type = "password";
    loginOverlay.hidden = false;
  }

  function closeLogin() {
    loginOverlay.hidden = true;
  }

  loginBtn.addEventListener("click", openLogin);
  loginModalClose.addEventListener("click", closeLogin);
  loginOverlay.addEventListener("click", (ev) => {
    if (ev.target === loginOverlay) closeLogin();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !loginOverlay.hidden) closeLogin();
  });

  document.querySelectorAll(".role-choice").forEach((btn) => {
    btn.addEventListener("click", () => {
      credsTitle.textContent = btn.dataset.role === "professor" ? "Entrar como professor" : "Entrar como aluno";
      roleStep.hidden = true;
      credsForm.hidden = false;
      loginEmail.focus();
    });
  });

  loginBackBtn.addEventListener("click", showRoleStep);

  function showLoginError(text) {
    loginErrorMsg.textContent = text;
    loginErrorMsg.className = "login-error show";
  }

  // Mesmo padrão de checkIsAdmin/checkIsProfessor (portal-mestre/js/auth.js,
  // professor-portal/js/auth.js) — devolve o nome do role de verdade em vez
  // de confiar em qual aba a pessoa escolheu no passo anterior.
  async function getRoleName(userId) {
    const { data: profile } = await client.from("profiles").select("role_id").eq("id", userId).maybeSingle();
    if (!profile?.role_id) return null;
    const { data: role } = await client.from("roles").select("name").eq("id", profile.role_id).maybeSingle();
    return role?.name ?? null;
  }

  credsForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    loginErrorMsg.className = "login-error";

    const email = loginEmail.value.trim();
    const password = loginPassword.value;
    if (!email || !password) {
      showLoginError("Preencha e-mail e senha.");
      return;
    }

    loginSubmitBtn.disabled = true;
    loginSubmitBtn.textContent = "Entrando...";

    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if (error || !data?.user) {
      loginSubmitBtn.disabled = false;
      loginSubmitBtn.textContent = "Entrar";
      showLoginError("E-mail ou senha inválidos.");
      return;
    }

    const roleName = await getRoleName(data.user.id);
    const destination = ROLE_DESTINATIONS[roleName];
    if (!destination) {
      await client.auth.signOut();
      loginSubmitBtn.disabled = false;
      loginSubmitBtn.textContent = "Entrar";
      showLoginError("Essa conta não tem acesso configurado.");
      return;
    }

    window.location.href = destination;
  });
</script>
</body>
</html>
